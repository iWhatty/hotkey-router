# Tests, build and type build on every pull request and every push to main.
# build.js fails on packaging mistakes (a side-effect entry tree-shaken away,
# hotkey-router/auto shipping a second router), so it runs here too.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" says >=18.
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # --ignore-scripts skips "prepare", so each step below reports on its own.
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node build.js
      - run: npm run build:types
      - run: npm pack --dry-run
